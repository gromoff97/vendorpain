options:
  baseUrl: "https://stash.example/rest/awesome-graphs-api/latest"
  auth:
    method: "basic"
    username: "bitbucket-login"
    password: "bitbucket-password"
    token: null
  sinceDate: "2026-03-04"
  untilDate: "2026-06-04"
  merges: "exclude"
  order: "newest"
  outputDir: "output"
  archive: true
  debug: false
  insecure: false
  timeoutSeconds: 60
  retries: 0
  ssh: null

exports:
  - path: ["Аутсорсинг", "ООО Ромашка"]
    slugs:
      - petrov.iv
      - ivanov.ia

  - path: ["Аутсорсинг", "Vendor QA", "Команда A"]
    slugs:
      - sidorov.sp
