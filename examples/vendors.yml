options:
  baseUrl: "https://stash.example/rest/awesome-graphs-api/latest"
  token: "paste-token-here"
  sinceDate: "2026-03-04"
  untilDate: "2026-06-04"
  merges: "exclude"
  order: "newest"
  outputDir: "output"
  archive: true
  debug: false
  timeoutSeconds: 60
  retries: 0

exports:
  - path: ["Аутсорсинг", "ООО Ромашка"]
    slugs:
      - petrov.iv
      - ivanov.ia

  - path: ["Аутсорсинг", "Vendor QA", "Команда A"]
    slugs:
      - sidorov.sp
